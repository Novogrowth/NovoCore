name: backend

# A check nobody has to remember to run catches more than one that depends on someone
# running it. This is the same reasoning that puts the ArchUnit suite in the build rather
# than in a checklist.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  # Lets the build be triggered by hand after changing something outside the paths above.
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Committed from Windows, where git does not track the executable bit by default.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw
        working-directory: backend

      # Step 12's backup tests run the real pg_dump, pg_restore and psql — the restore check
      # genuinely creates a database, restores the artefact into it and asserts the restored
      # ledger balances. Without these binaries BackupIT SKIPS rather than fails, which would be
      # the worst outcome available: a green build that silently stopped covering the one thing
      # brief §13 lists as an outstanding risk.
      #
      # THE MAJOR VERSION MUST MATCH the Testcontainers server and docker/Dockerfile (17).
      # pg_dump refuses outright to dump a newer server, so a mismatch is a hard failure rather
      # than a subtly wrong backup — but it is still a failure to avoid on purpose rather than
      # discover. Ubuntu's own archive does not carry 17, so this comes from PGDG.
      - name: Install PostgreSQL client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          # Installing 17 is NOT enough to make `pg_dump` mean 17, and assuming it was is what
          # broke this build: the runner already ships PostgreSQL 16, and `/usr/bin/pg_dump` is
          # postgresql-common's `pg_wrapper`, which picks a version from the local cluster rather
          # than the newest one installed. So a green install step was followed by
          # `pg_dump (PostgreSQL) 16.14`, and BackupIT — correctly — refused it.
          #
          # Name the versioned directory instead of relying on any resolution rule. PostgresTools
          # invokes the bare names `pg_dump`/`pg_restore`/`psql`, so PATH is the thing that has to
          # be right; $GITHUB_PATH prepends for every later step, this one included via the check
          # below.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # A separate step because $GITHUB_PATH only takes effect on the *next* one — and separate is
      # the right shape anyway: this is the assertion that the step above achieved what it claims.
      # Failing here names the problem; failing in BackupIT names a symptom two minutes later.
      - name: Confirm pg_dump, pg_restore and psql really are 17
        run: |
          echo "pg_dump resolves to: $(command -v pg_dump)"
          which -a pg_dump pg_restore psql || true
          for tool in pg_dump pg_restore psql; do
            version="$("$tool" --version)"
            echo "$version"
            case "$version" in
              *"(PostgreSQL) 17."*) ;;
              *) echo "::error::$tool is not version 17 — got: $version"; exit 1 ;;
            esac
          done

      # GitHub-hosted runners provide a Docker daemon, so the Testcontainers tests run for
      # real here. That matters: the ledger invariants are PostgreSQL constraints, and a run
      # that skipped them would be reporting on far less than it appears to.
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend

      - name: Upload test reports
        # Reports are most wanted precisely when the build failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/**
          retention-days: 14
          if-no-files-found: warn
