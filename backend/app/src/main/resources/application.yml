spring:
  application:
    name: novocore

  datasource:
    # No default password. If NOVOCORE_DB_PASSWORD is unset the application refuses to
    # start, which is the intended behaviour — a default or empty credential would quietly
    # become the production credential the first time someone forgot to set it.
    url: ${NOVOCORE_DB_URL:jdbc:postgresql://localhost:5432/novocore}
    username: ${NOVOCORE_DB_USER:novocore}
    password: ${NOVOCORE_DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never generate or alter DDL: the
      # debits=credits invariant is a database constraint trigger (CLAUDE.md rule 6) that
      # Hibernate cannot express and would silently drop if it ever regenerated the schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Applied migrations are immutable. Leaving validation on means an edited migration
    # fails startup instead of leaving environments silently diverged.
    validate-on-migrate: true
    # Stated explicitly rather than relying on the default. Migrations already contain
    # non-ASCII text (the chart of accounts uses em-dashes) and will contain Greek from step 5
    # on. If this were ever resolved from the platform default encoding, a Windows machine
    # would apply mojibake and Flyway's checksum would then differ between environments.
    encoding: UTF-8

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        # Health and info only. Anything more is an information disclosure surface on a
        # system holding financial data.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Reverse proxy and container runtime need liveness/readiness, not internals.
      show-details: never

server:
  # TLS terminates at the Caddy reverse proxy, so the app speaks plain HTTP on the internal
  # Docker network only. It is never published directly. See docker/compose.yml.
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      # Session cookie attributes. These are servlet container settings rather than Spring
      # Security ones, which is why they are here and not in SecurityConfiguration.
      cookie:
        name: NOVOCORESESSION
        # The reason Q22 chose sessions over a token in web storage: HttpOnly means a
        # cross-site scripting bug cannot read the session identifier at all.
        http-only: true
        # Not sent on cross-site requests, which blunts CSRF before the token check even runs.
        same-site: strict
        # Only ever sent over HTTPS. Caddy terminates TLS and forward-headers-strategy makes
        # the app aware of it. Overridden to false in tests, which run without a proxy.
        secure: true
      # A working day. Long enough not to interrupt someone mid-task, short enough that an
      # unattended machine does not stay logged in overnight.
      timeout: 8h

logging:
  level:
    root: INFO
    gr.novotrade.novocore: INFO
