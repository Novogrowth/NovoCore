name: novocore

# Base stack: PostgreSQL, the application, and a Caddy reverse proxy terminating TLS.
#
# HTTPS is present from the first commit rather than added later, per CLAUDE.md's stack
# section and brief §3. The application itself speaks plain HTTP and is never published to
# the host — only Caddy binds a port.
#
# Local development:  docker compose -f compose.yml -f compose.dev.yml up --build
# Production:         docker compose up -d --build   (with NOVOCORE_SITE_ADDRESS set to the
#                                                     real hostname so Caddy obtains a
#                                                     publicly trusted certificate)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NOVOCORE_DB_NAME:-novocore}
      POSTGRES_USER: ${NOVOCORE_DB_USER:-novocore}
      # No default. Compose refuses to start if this is unset, which is the point — a
      # fallback password would eventually become a production password.
      POSTGRES_PASSWORD: ${NOVOCORE_DB_PASSWORD:?NOVOCORE_DB_PASSWORD must be set; copy .env.example to .env}
      # Deterministic collation. Left to the host locale, sort order for Greek text could
      # differ between machines, which would make report output environment-dependent.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=${NOVOCORE_DB_USER:-novocore} --dbname=${NOVOCORE_DB_NAME:-novocore}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      # Repository root, so the Dockerfile can see backend/. See .dockerignore.
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NOVOCORE_DB_URL: jdbc:postgresql://postgres:5432/${NOVOCORE_DB_NAME:-novocore}
      NOVOCORE_DB_USER: ${NOVOCORE_DB_USER:-novocore}
      NOVOCORE_DB_PASSWORD: ${NOVOCORE_DB_PASSWORD:?NOVOCORE_DB_PASSWORD must be set; copy .env.example to .env}
      # The first Owner account, used only when no user exists yet. There is deliberately no
      # seeded default account: the application refuses to start on an empty user table without
      # these, rather than shipping an admin/admin that outlives every intention to change it.
      # Safe to leave empty here once the first owner has been created.
      NOVOCORE_BOOTSTRAP_OWNER_USERNAME: ${NOVOCORE_BOOTSTRAP_OWNER_USERNAME:-}
      NOVOCORE_BOOTSTRAP_OWNER_PASSWORD: ${NOVOCORE_BOOTSTRAP_OWNER_PASSWORD:-}
      # The SMTP password, used only on the first start where none is stored yet. It then
      # lives in Settings with the rest of the email configuration, which migration V20
      # seeds. Absent from that migration deliberately: a credential committed to git is in
      # git permanently. Unlike the owner password, leaving this empty does not stop the
      # application — email queues and does not send, and the outbox says so.
      NOVOCORE_SMTP_PASSWORD: ${NOVOCORE_SMTP_PASSWORD:-}
      # Backups are encrypted with this before anything leaves the host, and it is deliberately
      # NOT a setting: the settings table is inside the dump, so a key stored there would be
      # encrypted inside the artefact it exists to decrypt.
      #
      # No default, and unlike the SMTP password it is not merely a first-start hand-off — it is
      # read on every backup and every restore. If it is unset, no backup is taken and the log
      # says so loudly on each attempt.
      #
      # ⚠️ RECORD IT IN A PASSWORD MANAGER. It lives in docker/.env, which is gitignored and
      # machine-local. If that is the only copy, losing this machine loses the database and every
      # backup of it at the same time — the one occasion both were supposed to help.
      NOVOCORE_BACKUP_ENCRYPTION_KEY: ${NOVOCORE_BACKUP_ENCRYPTION_KEY:-}
      # OAuth credentials for the two Drive destinations, supplied once and then stored in
      # Settings — the same route the SMTP password takes. Blank until the consent flow has been
      # completed for each Google account; a destination without them is recorded NOT_CONFIGURED
      # on every run rather than silently skipped.
      NOVOCORE_BACKUP_DRIVE_PRIMARY_CLIENT_SECRET: ${NOVOCORE_BACKUP_DRIVE_PRIMARY_CLIENT_SECRET:-}
      NOVOCORE_BACKUP_DRIVE_PRIMARY_REFRESH_TOKEN: ${NOVOCORE_BACKUP_DRIVE_PRIMARY_REFRESH_TOKEN:-}
      NOVOCORE_BACKUP_DRIVE_SECONDARY_CLIENT_SECRET: ${NOVOCORE_BACKUP_DRIVE_SECONDARY_CLIENT_SECRET:-}
      NOVOCORE_BACKUP_DRIVE_SECONDARY_REFRESH_TOKEN: ${NOVOCORE_BACKUP_DRIVE_SECONDARY_REFRESH_TOKEN:-}
    volumes:
      # Backups survive container replacement. Without this the retained copies would live in the
      # container's writable layer and vanish on the next `docker compose up --build` — which is
      # to say the local half of the retention rule would be a fiction.
      - backup-data:/var/lib/novocore/backups
    depends_on:
      postgres:
        # Waits for readiness, not just container start, so Flyway does not race the database.
        condition: service_healthy
    # `expose`, not `ports`: reachable on the internal network only. Publishing 8080 would
    # hand out an unencrypted route straight past Caddy.
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      # QUIC / HTTP3
      - "443:443/udp"
    environment:
      # Defaults to plain `localhost`, not `novocore.localhost`. Windows does not resolve
      # *.localhost subdomains: browsers resolve them internally per RFC 6761, but the OS
      # resolver, curl, and any script do not — so a subdomain default would appear to work
      # in a browser while breaking every command-line check against it.
      NOVOCORE_SITE_ADDRESS: ${NOVOCORE_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the local CA live in a volume. Without this, every restart
      # re-issues certificates, which in production would quickly hit rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  # Local backup staging and retention. A named volume rather than a bind mount so it works
  # identically on Windows and Linux hosts; the off-site copies are what protect against losing
  # the machine this volume is on.
  backup-data:
